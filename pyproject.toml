[project]
name = "ragnosis"
version = "0.1.0"
description = "RAG pipelines (basic + advanced) over a synthetic clinic dataset, with retrieval and answer evals."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.0.0",
    "flagembedding>=1.4.0",
    "groq>=1.5.0",
    "langchain-chroma>=1.1.0",
    "langchain-core>=0.4.0",
    "langchain-text-splitters>=0.4.0",
    "numpy>=2.5.0",
    "openai>=2.43.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.5.0",
    "tiktoken>=0.8.0",
    "tqdm>=4.68.3",
    "transformers>=4.44,<5",
]
